# Hugo Blox GitHub Action to convert Bibtex publications to Markdown-based webpages
name: Import Publications From Bibtex

# Require permission to create a PR
permissions:
  contents: write
  pull-requests: write

# Run workflow when either `.bib` file is added or updated.
# `publications.bib`  -> content/publication/  (published + forthcoming)
# `workingpapers.bib` -> content/workings/     (working papers)
# Keep these disjoint: a working-paper entry left in `publications.bib` gets
# re-created under content/publication/, duplicating it on the homepage.
on:
  push:
    branches: ['main']
    paths: ['publications.bib', 'workingpapers.bib']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  hugoblox:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install academic==0.10.0
      - name: Run Academic (Bibtex To Markdown Converter)
        # Check `.bib` file exists for case when action runs on `.bib` deletion
        # Note GH only provides hashFiles func in `steps.if` context, not `jobs.if` context
        if: ${{ hashFiles('publications.bib') != '' }}
        run: academic import publications.bib content/publication/ --compact
      - name: Run Academic (working papers)
        if: ${{ hashFiles('workingpapers.bib') != '' }}
        run: academic import workingpapers.bib content/workings/ --compact
      - name: Create Pull Request
        # Set ID for `Check outputs` stage
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'content: import publications from Bibtex'
          title: Hugo Blox Builder - Import latest publications
          body: |
            Import the latest entries from `publications.bib` to `content/publication/`
            and from `workingpapers.bib` to `content/workings/`.

            Note: `academic import` runs without `--overwrite`, so it only ever *creates*
            folders for slugs that don't exist yet. It cannot update a paper already on the
            site — edit that paper's `index.md` directly instead.

            [View Documentation](https://github.com/GetRD/academic-file-converter)
          base: main
          labels: automated-pr, content
          branch: hugoblox-import-publications
          delete-branch: true
      - name: Check outputs
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
